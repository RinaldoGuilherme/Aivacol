services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: aivacol-api
    command: npm run start:dev
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - aivacol-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: aivacol-worker
    command: npm run start:worker:dev
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - aivacol-network
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aivacol-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "${DB_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aivacol-network

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aivacol-db-init
    env_file:
      - .env
    entrypoint:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U "$$DB_USERNAME" -P "$$DB_PASSWORD" -C -Q "IF DB_ID('$$DB_DATABASE') IS NULL CREATE DATABASE [$$DB_DATABASE]"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    networks:
      - aivacol-network

  redis:
    image: redis:7-alpine
    container_name: aivacol-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - aivacol-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: aivacol-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - aivacol-network

  mongodb:
    image: mongo:7
    container_name: aivacol-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
      MONGO_INITDB_DATABASE: "${MONGO_DATABASE}"
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - aivacol-network

volumes:
  sqlserver_data:
  redis_data:
  rabbitmq_data:
  mongodb_data:

networks:
  aivacol-network:
    driver: bridge