
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aivacol-api
    ports:
      - "${APP_PORT}:3000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - aivacol-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aivacol-worker
    command: node dist/worker.js
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - aivacol-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aivacol-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "${DB_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - aivacol-network

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aivacol-db-init
    env_file:
      - .env
    entrypoint:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$DB_PASSWORD" -C -Q "IF DB_ID('$$DB_NAME') IS NULL CREATE DATABASE [$$DB_NAME]"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    networks:
      - aivacol-network

  redis:
    image: redis:7-alpine
    container_name: aivacol-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - aivacol-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: aivacol-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - aivacol-network

  mongodb:
    image: mongo:7
    container_name: aivacol-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
      MONGO_INITDB_DATABASE: "${MONGO_DATABASE}"
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - aivacol-network

volumes:
  sqlserver_data:
  redis_data:
  rabbitmq_data:
  mongodb_data:

networks:
  aivacol-network:
    driver: bridge
